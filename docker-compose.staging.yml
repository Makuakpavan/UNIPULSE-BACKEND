version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: unipulse-backend:staging
    ports:
      - "5001:5000"
    env_file:
      - .env.staging
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:6-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
